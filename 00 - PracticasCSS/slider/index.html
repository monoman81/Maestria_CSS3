<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Slider</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #929292;
        }

        .container {
            position: relative;
            margin: 50px auto;
            background-color: #FFFFFF;
            width: 1000px;
            height: 550px;
            padding: 10px;

        }

        .slider div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .slider div img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider div:first-child {
            opacity: 1;
        }

        .slider div:target {
            opacity: 1;
        }

        ul li {
            list-style: none;
        }

        .slider {
            position: relative;
            width: 100%;
            height: 90%;
        }

        .menu {
            text-align: center;
            margin: 10px;
        }

        .menu li {
            display: inline-block;
            text-align: center;
        }

        .menu li a {
            display: inline-block;
            width: 40px;
            height: 40px;
            text-decoration: none;
            line-height: 40px;
            background-color: #262626;
            font-size: 20px;
            border-radius: 50%;
            color: #fff;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="slider">
            <div id="slide1"><img src="img/image1.jpg" alt="image1"></div>
            <div id="slide2"><img src="img/image2.jpg" alt="image2"></div>
            <div id="slide3"><img src="img/image3.jpg" alt="image3"></div>
            <div id="slide4"><img src="img/image4.jpg" alt="image4"></div>
            <div id="slide5"><img src="img/image5.jpg" alt="image5"></div>
        </div>
        <ul class="menu">
            <li><a href="#slide1">1</a></li>
            <li><a href="#slide2">2</a></li>
            <li><a href="#slide3">3</a></li>
            <li><a href="#slide4">4</a></li>
            <li><a href="#slide5">5</a></li>
        </ul>
    </div>
</body>
</html>
