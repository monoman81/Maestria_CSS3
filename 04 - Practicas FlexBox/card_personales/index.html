    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Open Sans", sans-serif;
            background-color: #e0f7fa;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .card {
            width: 300px;
            height: 400px;
            position: relative;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0 0 0 / .2);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img {
            width: 100%;
            height: 100%;
        }

        .img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .content {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
            transform: translateY(100%);
            transition: all .5s;
            transition-delay: .2s;
        }

        .card:hover .content {
            transform: translateY(0);
        }

        .content .text {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .text h3,
        .text span {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-size: 22px;
            text-align: center;
            opacity: 0;
            transition: all .2s;
            transition-delay: 0s;
        }

        .text span {
            font-size: 12px;
        }

        .card:hover .text h3,
        .card:hover .text span {
            transition-delay: .5s;
            opacity: 1;
        }

        .sociales {
            margin: 20px 0;
            width: 60%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .sociales a svg {
            width: 32px;
            height: 32px;
            stroke: #ccc;
            transform: translateY(40px);
            opacity: 0;
            transition: all .2s;
        }

        .card:hover .sociales a svg {
            transform: translateY(0);
            opacity: 1;
            transition-delay: .5s;
        }

        .card:hover .sociales a:nth-child(2) svg {
            transition-delay: .6s;
        }

        .card:hover .sociales a:nth-child(3) svg {
            transition-delay: .7s;
        }


    </style>

</head>
