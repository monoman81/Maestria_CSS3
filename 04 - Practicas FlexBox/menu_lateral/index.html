    <title>Menu Tooltip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffd107;
            font-family: "Open Sans", sans-serif;
        }

        .icon {
            width: 20px;
            height: 20px;
        }

        nav {
            background-color: #fff;
            display: flex;
            position: relative;
            width: 60px;
            height: 300px;
            border-radius: 10px;
            padding: 5px;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        nav a {
            position: relative;
            width: 100%;
            height: 15%;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #0077ff;
            transition: all .5s;
        }

        nav a:hover {
            background-color: #0077ff;
            color: #fff;
        }

        .title {
            position: absolute;
            left: 60px;
            background-color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            color: #0077ff;
            font-weight: 600;
            opacity: 0;
            transition: all .5s;
        }

        .title::before {
            content: "";
            position: absolute;
            top: 35%;
            left: -5px;
            width: 12px;
            height: 12px;
            background-color: #fff;
            transform: rotate(45deg);
        }

        nav a:hover .title {
            opacity: 1;
            transform: translateX(10px);
        }

    </style>

</head>
