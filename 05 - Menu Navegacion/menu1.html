    <title>Menu Sociales</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Open Sans", sans-serif;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px;
            background-color: #0DCAF0;
        }

        nav a {
            text-decoration: none;
            border-radius: 50%;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .5s;
        }

        nav a:hover {
            background-color: rgba(0 0 0 / .1);
            box-shadow: 0 0 10px rgba(0 0 0 / .1);
        }

        svg {
            width: 32px;
            height: 32px;
            stroke: rgba(255 255 255 / .5);
            transition: all .5s;
        }

        nav a:hover svg {
            stroke: rgba(255 255 255 / 1);
        }


    </style>

</head>
