<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Menu Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/24d0a550b8.js" crossorigin="anonymous"></script>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Open Sans", sans-serif;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 60px;
            height: 100vh;
            background-color: #111;
        }

        .contenedor-imagen {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 100%;
        }

        .enlaces {
            height: 60%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        a {
            text-decoration: none;
            font-size: 18px;
            color: rgba(255 255 255 / .4);
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all .5s;
        }

        a:hover {
            background-color: rgba(255 255 255 / .1);
            color: #0d6efd;
        }

        .btn-inferior {
            position: absolute;
            bottom: 0;
        }

        .btn-inferior:hover {
            background-color: #dc3545;
            color: #fff;
        }

        header {
            height: 50px;
            padding: 0 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 .125rem .25rem rgba(0 0 0 / .075);
            border-bottom: 1px solid #f5f5f5;
        }

        header p {
            font-size: 1.2em;
            font-style: italic;
            letter-spacing: 1px;
            font-weight: 600;
        }

        header .info-user {
            display: flex;
            align-items: center;
        }

        header .info-user .icon-bell {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin: 0 15px;
            font-size: 1.2em;
            color: #4b4b4b;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        header .info-user span {
            position: relative;
        }

        header .info-user span::after {
            content: "";
            position: absolute;
            top: -6px;
            right: 14px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #dc3545;
        }

        header .info-user .container-imagen {
            position: relative;
            cursor: pointer;
        }

        header .info-user .container-imagen img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
        }

        header .info-user .container-imagen::after {
            content: "";
            position: absolute;
            bottom: 3px;
            right: -2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #37e920;
        }

        .sociales {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
        }

        .sociales .icon {
            margin: 0 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .sociales .icon span {
            width: 50px;
            height: 50px;
            background-color: #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .sociales .icon .tooltip {
            position: absolute;
            top: -60px;
            background-color: #ccc;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(50%);
            transition: all .5s;
            pointer-events: auto;
        }

        .sociales .icon:hover .tooltip {
            opacity: 1;
            transform: translateY(0);
        }

        .sociales .icon .tooltip::before {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 15px;
            height: 15px;
            background-color: inherit;
        }

        .sociales .facebook span,
        .sociales .twitter span,
        .sociales .instagram span,
        .sociales .youtube span {
            transition: all .5s;
        }

        .sociales .facebook:hover span,
        .sociales .facebook:hover .tooltip {
            background-color: #3b5999;
            color: #fff;
        }

        .sociales .twitter:hover span,
        .sociales .twitter:hover .tooltip {
            background-color: #46c1f6;
            color: #fff;
        }

        .sociales .instagram:hover span,
        .sociales .instagram:hover .tooltip {
            background-color: #e1306c;
            color: #fff;
        }

        .sociales .youtube:hover span,
        .sociales .youtube:hover .tooltip {
            background-color: #dc3545;
            color: #fff;
        }

    </style>

</head>
<body>
    <!-- Menu Lateral -->
    <nav>
        <div class="contenedor-imagen">
            <img src="img/logo3.png" alt="" class="logo">
        </div>

        <div class="enlaces">
            <a href=""><span class="fas fa-users"></span></a>
            <a href=""><span class="fas fa-shopping-bag"></span></a>
            <a href=""><span class="fas fa-file-invoice-dollar"></span></a>
            <a href=""><span class="fas fa-comments"></span></a>
            <a href=""><span class="fas fa-file-alt"></span></a>
            <a href=""><span class="fas fa-cog"></span></a>
        </div>

        <a href="" class="btn-inferior"><span class="fas fa-power-off"></span></a>
    </nav>

    <!-- Menu superior -->
    <header>
        <p>Bienvenido</p>

        <div class="info-user">
            <span><i class="fas fa-bell icon-bell"></i></span>
            <div class="container-imagen">
                <img src="img/perfil.jpg" alt="">
            </div>
        </div>
    </header>

    <!-- Sociales -->
    <div class="sociales">
        <div class="icon facebook">
            <div class="tooltip">Facebook</div>
            <span>
                <i class="fab fa-facebook-f"></i>
            </span>
        </div>

        <div class="icon twitter">
            <div class="tooltip">Twitter</div>
            <span>
                <i class="fab fa-twitter icon-soc"></i>
            </span>
        </div>


        <div class="icon instagram">
            <div class="tooltip">Instagram</div>
            <span>
                <i class="fab fa-instagram icon-soc"></i>
            </span>
        </div>

        <div class="icon youtube">
            <div class="tooltip">Youtube</div>
            <span>
                <i class="fab fa-youtube icon-soc"></i>
            </span>
        </div>
    </div>

</body>
</html>
